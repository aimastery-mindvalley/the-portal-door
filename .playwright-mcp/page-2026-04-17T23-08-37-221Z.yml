  - paragraph [ref=e35]: “You were never lost. You were simply asleep inside a story that forgot your name.”
  - generic [ref=e37]:
    - generic [ref=e38]:
      - paragraph [ref=e39]: About the Book
      - heading "A door was opened. It was always you." [level=2] [ref=e40]:
        - text: A door was opened.
        - text: It was always you.
    - generic [ref=e42]:
      - paragraph [ref=e43]: The Portal Door is not a metaphor. It is a living threshold — woven from the geometry of the cosmos and the memory of the soul. This book walks with you to its edge, and gently, without pressure, invites you to pass through.
      - paragraph [ref=e44]: Drawing on ancient remembrance, sacred geometry, and the quiet wisdom of lived awakening, 4 Brooms offers a map for anyone who has felt the call of a larger life — and wondered if they were imagining it.
      - paragraph [ref=e45]: You are not imagining it. You are remembering.
  - generic [ref=e47]:
    - generic [ref=e49]:
      - paragraph [ref=e50]: What You Will Remember
      - heading "Four passages through the door" [level=3] [ref=e51]
    - generic [ref=e53]:
      - article [ref=e54]:
        - generic [ref=e55]: "01"
        - heading "The Veil" [level=4] [ref=e56]
        - paragraph [ref=e57]: A clear seeing of the story you were handed — and a gentle parting of the curtain between noise and knowing.
      - article [ref=e58]:
        - generic [ref=e59]: "02"
        - heading "The Breath" [level=4] [ref=e60]
        - paragraph [ref=e61]: "The simplest practice, returned to its original power: coming home to the body, the moment, the now."
      - article [ref=e62]:
        - generic [ref=e63]: "03"
        - heading "The Geometry" [level=4] [ref=e64]
        - paragraph [ref=e65]: Ancient patterns of coherence — how the cosmos writes itself through you, and how to read the language again.
      - article [ref=e66]:
        - generic [ref=e67]: "04"
        - heading "The Walk" [level=4] [ref=e68]
        - paragraph [ref=e69]: "What remembering asks of a life: softness, courage, and the quiet courage to live as who you already are."
