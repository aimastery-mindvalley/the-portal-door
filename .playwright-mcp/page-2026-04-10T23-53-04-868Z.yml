      - heading "Four passages through the door" [level=3] [ref=e52]
    - generic [ref=e54]:
      - article [ref=e55]:
        - generic [ref=e56]: "01"
        - heading "The Veil" [level=4] [ref=e57]
        - paragraph [ref=e58]: A clear seeing of the story you were handed — and a gentle parting of the curtain between noise and knowing.
      - article [ref=e59]:
        - generic [ref=e60]: "02"
        - heading "The Breath" [level=4] [ref=e61]
        - paragraph [ref=e62]: "The simplest practice, returned to its original power: coming home to the body, the moment, the now."
      - article [ref=e63]:
        - generic [ref=e64]: "03"
        - heading "The Geometry" [level=4] [ref=e65]
        - paragraph [ref=e66]: Ancient patterns of coherence — how the cosmos writes itself through you, and how to read the language again.
      - article [ref=e67]:
        - generic [ref=e68]: "04"
        - heading "The Walk" [level=4] [ref=e69]
        - paragraph [ref=e70]: "What remembering asks of a life: softness, courage, and the quiet courage to live as who you already are."
