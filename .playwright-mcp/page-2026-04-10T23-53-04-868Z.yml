  - paragraph [ref=e36]: “You were never lost. You were simply asleep inside a story that forgot your name.”
  - generic [ref=e38]:
    - generic [ref=e39]:
      - paragraph [ref=e40]: About the Book
      - heading "A door was opened. It was always you." [level=2] [ref=e41]:
        - text: A door was opened.
        - text: It was always you.
    - generic [ref=e43]:
      - paragraph [ref=e44]: The Portal Door is not a metaphor. It is a living threshold — woven from the geometry of the cosmos and the memory of the soul. This book walks with you to its edge, and gently, without pressure, invites you to pass through.
      - paragraph [ref=e45]: Drawing on ancient remembrance, sacred geometry, and the quiet wisdom of lived awakening, 4 Brooms offers a map for anyone who has felt the call of a larger life — and wondered if they were imagining it.
      - paragraph [ref=e46]: You are not imagining it. You are remembering.
