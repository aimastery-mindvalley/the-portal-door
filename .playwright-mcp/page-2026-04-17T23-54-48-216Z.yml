    - paragraph [ref=e36]: “You were never lost. You were simply asleep inside a story that forgot your name.”
    - paragraph [ref=e37]: A door was opened. It was always you. You are not imagining it; you are remembering.
  - generic [ref=e39]:
    - generic [ref=e41]:
      - paragraph [ref=e42]: What You Will Remember
      - heading "Four passages through the door" [level=3] [ref=e43]
    - generic [ref=e45]:
      - article [ref=e46]:
        - generic [ref=e47]: "01"
        - heading "The Veil" [level=4] [ref=e48]
        - paragraph [ref=e49]: A clear seeing of the story you were handed — and a gentle parting of the curtain between noise and knowing.
      - article [ref=e50]:
        - generic [ref=e51]: "02"
        - heading "The Breath" [level=4] [ref=e52]
        - paragraph [ref=e53]: "The simplest practice, returned to its original power: coming home to the body, the moment, the now."
      - article [ref=e54]:
        - generic [ref=e55]: "03"
        - heading "The Geometry" [level=4] [ref=e56]
        - paragraph [ref=e57]: Ancient patterns of coherence — how the cosmos writes itself through you, and how to read the language again.
      - article [ref=e58]:
        - generic [ref=e59]: "04"
        - heading "The Walk" [level=4] [ref=e60]
        - paragraph [ref=e61]: "What remembering asks of a life: softness, courage, and the quiet courage to live as who you already are."
