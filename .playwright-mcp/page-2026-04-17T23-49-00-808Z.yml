      - heading "Four passages through the door" [level=3] [ref=e50]
    - generic [ref=e52]:
      - article [ref=e53]:
        - generic [ref=e54]: "01"
        - heading "The Veil" [level=4] [ref=e55]
        - paragraph [ref=e56]: A clear seeing of the story you were handed — and a gentle parting of the curtain between noise and knowing.
      - article [ref=e57]:
        - generic [ref=e58]: "02"
        - heading "The Breath" [level=4] [ref=e59]
        - paragraph [ref=e60]: "The simplest practice, returned to its original power: coming home to the body, the moment, the now."
      - article [ref=e61]:
        - generic [ref=e62]: "03"
        - heading "The Geometry" [level=4] [ref=e63]
        - paragraph [ref=e64]: Ancient patterns of coherence — how the cosmos writes itself through you, and how to read the language again.
      - article [ref=e65]:
        - generic [ref=e66]: "04"
        - heading "The Walk" [level=4] [ref=e67]
        - paragraph [ref=e68]: "What remembering asks of a life: softness, courage, and the quiet courage to live as who you already are."
