        - heading "The Veil" [level=4] [ref=e64]
        - paragraph [ref=e65]: A clear seeing of the story you were handed — and a gentle parting of the curtain between noise and knowing.
      - article [ref=e66]:
        - generic [ref=e67]: "02"
        - heading "The Breath" [level=4] [ref=e68]
        - paragraph [ref=e69]: "The simplest practice, returned to its original power: coming home to the body, the moment, the now."
      - article [ref=e70]:
        - generic [ref=e71]: "03"
        - heading "The Geometry" [level=4] [ref=e72]
        - paragraph [ref=e73]: Ancient patterns of coherence — how the cosmos writes itself through you, and how to read the language again.
      - article [ref=e74]:
