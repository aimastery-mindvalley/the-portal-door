      - heading "Four passages through the door" [level=3] [ref=e49]
    - generic [ref=e51]:
      - article [ref=e52]:
        - generic [ref=e53]: "01"
        - heading "The Veil" [level=4] [ref=e54]
        - paragraph [ref=e55]: A clear seeing of the story you were handed — and a gentle parting of the curtain between noise and knowing.
      - article [ref=e56]:
        - generic [ref=e57]: "02"
        - heading "The Breath" [level=4] [ref=e58]
        - paragraph [ref=e59]: "The simplest practice, returned to its original power: coming home to the body, the moment, the now."
      - article [ref=e60]:
        - generic [ref=e61]: "03"
        - heading "The Geometry" [level=4] [ref=e62]
        - paragraph [ref=e63]: Ancient patterns of coherence — how the cosmos writes itself through you, and how to read the language again.
      - article [ref=e64]:
        - generic [ref=e65]: "04"
        - heading "The Walk" [level=4] [ref=e66]
        - paragraph [ref=e67]: "What remembering asks of a life: softness, courage, and the quiet courage to live as who you already are."
