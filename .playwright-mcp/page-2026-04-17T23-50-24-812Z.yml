      - heading "The Portal Door" [level=1] [ref=e18]
      - paragraph [ref=e19]: The Time of Remembering
      - paragraph [ref=e20]: There is a threshold in every life where the old explanations stop working, and something truer begins to rise from underneath. Quiet, unmistakable, ancient.
      - paragraph [ref=e21]: Five strangers feel it at the same moment. An artist, a scientist, a healer, a musician, a storyteller. Each of them hears the same frequency from opposite corners of the world, and each of them follows it home.
      - paragraph [ref=e22]: The Portal Door is the story of the five who answered that call, and an invitation for the one inside you who has been waiting.
