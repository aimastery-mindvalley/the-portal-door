  - generic [ref=e39]:
    - generic [ref=e40]:
      - paragraph [ref=e41]: About the Book
      - heading "A door was opened. It was always you." [level=2] [ref=e42]:
        - text: A door was opened.
        - text: It was always you.
    - generic [ref=e44]:
      - paragraph [ref=e45]: The Portal Door is not a metaphor. It is a living threshold — woven from the geometry of the cosmos and the memory of the soul. This book walks with you to its edge, and gently, without pressure, invites you to pass through.
      - paragraph [ref=e46]: Drawing on ancient remembrance, sacred geometry, and the quiet wisdom of lived awakening, 4 Brooms offers a map for anyone who has felt the call of a larger life — and wondered if they were imagining it.
      - paragraph [ref=e47]: You are not imagining it. You are remembering.
